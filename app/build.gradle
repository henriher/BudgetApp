plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.budget.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.budget.app"
        minSdk 26          // Android 8.0+ (Chaquopy exige minSdk >= 21)
        targetSdk 34
        versionCode 1
        versionName "1.0"

        python {
            // Version Python embarquée dans l'APK
            version "3.11"

            pip {
                install "requests"      // Appels HTTP vers l'API Bunq
                install "cryptography"  // Génération clés RSA (installation Bunq)
            }
        }

        ndk {
            // Architectures ciblées : physique (arm64) + émulateur Intel (x86_64)
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main {
            // Dossier source Python pour Chaquopy
            python.srcDir "src/main/python"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
